<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only Aura's own scripts may run; no forms, plugins or outside connections (fonts excepted) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Aura Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">  <!-- colours, buttons, icons -->
  <link rel="stylesheet" href="dock.css">
</head>
<body class="dock-body pill">

  <!-- Collapsed: the pill. While music plays it shows the song instead (Now Playing, dock.js) -->
  <button class="pill-btn" id="pill" title="Ask Aura">
    <img src="logo-round.svg" class="pill-logo" alt="">
    <span class="pill-art" id="pillArt"></span>
    <span class="pill-text" id="pillText">Ask Aura anything…</span>
    <span class="pill-song" id="pillSong"></span>
    <span class="pill-dot" id="pillDot"></span>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="pill-chip" id="pillChip"></span>  <!-- notch: the timer beside the song -->

    <span class="pill-progress"><span id="pillBar"></span></span>
    <!-- Notch only: the focus timer, and the volume / brightness bar (on top of the rest) -->
    <span class="pill-timer" id="pillTimer">
      <i data-icon="clock" data-size="16"></i><b id="pillTime">0:00</b><span class="timer-tag">Focus</span>
      <span class="timer-line"><span id="timerLine"></span></span>
    </span>
    <span class="pill-hud" id="pillHud">
      <span id="hudIcon"></span><span class="hud-bar"><span id="hudBar"></span></span><b id="hudPct"></b>
    </span>
  </button>
  <!-- Play / pause / next: on top of the pill's right end, shown when you hover it -->
  <div class="pill-controls" id="pillControls">
    <button class="media-btn" data-media="previous" title="Previous"><i data-icon="skipBack" data-size="13"></i></button>
    <button class="media-btn toggle" data-media="toggle" title="Play / pause"><i data-icon="pause" data-size="13"></i></button>
    <button class="media-btn" data-media="next" title="Next"><i data-icon="skipNext" data-size="13"></i></button>
  </div>

  <!-- Notch: a notification banner (task done, reminder, charger, Bluetooth, copied, AI limit) -->
  <div class="banner" id="banner" role="status" aria-live="polite">
    <span class="banner-icon" id="bannerIcon"></span>
    <span class="banner-main"><b id="bannerTitle"></b><span id="bannerText"></span></span>
    <button class="btn" id="bannerSnooze" hidden>Snooze</button>
  </div>

  <!-- Expanded: input + results -->
  <div class="panel" id="panel">
    <form class="dock-input" id="dockForm" autocomplete="off">
      <img src="logo.svg" class="dock-logo" alt="">
      <input id="dockInput" maxlength="1000" placeholder="Give Aura a task… e.g. open VS Code and today's news">
      <button type="button" class="dock-icon-btn mic" id="dockMic" title="Voice typing"><i data-icon="mic" data-size="16"></i></button>
      <button type="submit" class="dock-icon-btn send" id="dockSend" title="Run"><i data-icon="send" data-size="16"></i></button>
      <button type="button" class="dock-icon-btn" id="dockOpen" title="Open Aura"><i data-icon="open" data-size="16"></i></button>
      <button type="button" class="dock-icon-btn" id="dockClose" title="Collapse (Esc)"><i data-icon="expand" data-size="16"></i></button>
    </form>
    <!-- Now Playing card (only while something plays) -->
    <div class="now-card" id="nowCard">
      <span class="now-art" id="nowArt"></span>
      <div class="now-main">
        <div class="now-title" id="nowTitle"></div>
        <div class="now-artist" id="nowArtist"></div>
        <div class="now-time">
          <span id="nowPos">0:00</span>
          <span class="now-bar"><span id="nowBar"></span></span>
          <span id="nowDur">0:00</span>
        </div>
      </div>
      <div class="now-controls">
        <button class="media-btn" data-media="previous" title="Previous"><i data-icon="skipBack" data-size="15"></i></button>
        <button class="media-btn toggle big" data-media="toggle" title="Play / pause"><i data-icon="pause" data-size="16"></i></button>
        <button class="media-btn" data-media="next" title="Next"><i data-icon="skipNext" data-size="15"></i></button>
      </div>
    </div>
    <!-- Notch only: commands matching what you type (Enter runs the highlighted one) -->
    <div class="palette" id="palette" hidden></div>
    <!-- Notch only: Home (calendar, weather, up next, focus timer, quick toggles); filled by dock.js -->
    <div class="home" id="home">
      <div class="home-bar">
        <div class="tabs" role="tablist">
          <button class="tab on" data-tab="home" role="tab">Home</button>
          <button class="tab" data-tab="shelf" role="tab">Clipboard</button>
          <button class="tab" data-tab="usage" role="tab">AI usage</button>
        </div>
        <span class="chip" id="homeBattery"></span>
        <span class="grow"></span>
        <button class="round-btn" id="homeMute" title="Mute"><i data-icon="volume" data-size="15"></i></button>
        <button class="round-btn" id="homeAwake" title="Keep awake (no sleep)"><i data-icon="coffee" data-size="15"></i></button>
        <button class="round-btn" id="homeLock" title="Lock the PC"><i data-icon="lock" data-size="15"></i></button>
      </div>
      <div class="shelf pane" id="shelfPane" hidden></div>
      <div class="usage pane" id="usagePane" hidden></div>
      <div class="home-grid pane" id="homePane">
        <section class="cal">
          <div class="cal-head">
            <b id="calTitle"></b>
            <button class="round-btn small" id="calPrev" title="Previous month"><i data-icon="left" data-size="13"></i></button>
            <button class="round-btn small" id="calNext" title="Next month"><i data-icon="right" data-size="13"></i></button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </section>
        <section>
          <div class="home-label"><i data-icon="cloud" data-size="13"></i> Weather</div>
          <div class="weather" id="weather"><span class="muted">Loading…</span></div>
          <div class="home-label up">Up next</div>
          <div class="up-next" id="upNext"></div>
        </section>
        <section>
          <div class="home-label"><i data-icon="clock" data-size="13"></i> Focus timer</div>
          <div class="timer-big" id="timerBig">--:--</div>
          <div class="timer-presets" id="timerPresets"></div>
        </section>
      </div>
    </div>
    <div class="dock-results" id="dockResults"></div>
  </div>

<script src="icons.js"></script>
<script src="voice.js"></script>
<script src="dock.js"></script>
</body>
</html>
